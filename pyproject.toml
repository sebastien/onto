[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "onto-lang"
version = "0.2.0"
description = "Compact text formats for ontologies, observations and mappings"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
onto = "onto.main:main"

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4.18"]

[tool.setuptools]
package-dir = { "" = "src/py" }

[tool.setuptools.packages.find]
where = ["src/py"]
include = ["onto*"]

[tool.pytest.ini_options]
python_files = ["T*.py"]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
# NOTE: The optional hexa integration is tested against the sibling checkout when present.
pythonpath = ["src/py", "../hexa/src/py"]
