[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "onto"
version = "0.1.0"
description = "Compact text formats for ontologies, observations and mappings"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = { "" = "src/py" }

[tool.setuptools.packages.find]
where = ["src/py"]
include = ["onto*"]

[tool.pytest.ini_options]
python_files = ["*.test.py"]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src/py"]
